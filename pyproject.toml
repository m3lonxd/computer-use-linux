[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-linux"
version = "0.7.0"
description = "AI ajanlarına masaüstü görme + kontrol: pencereler, gerçek fare/klavye, erişilebilirlik ağacı, terminaller"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Linux X11: XTEST giriş, EWMH pencereler, ajan imleci
    "python-xlib>=0.33; sys_platform == 'linux'",
    # Windows: UI Automation öğe ağacı
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
# ekran görüntüsünü pencereye kırpma / küçültme
image = ["pillow>=9"]
# MCP sunucusu (computer-use-linux-mcp)
mcp = ["mcp>=1.2"]
all = ["pillow>=9", "mcp>=1.2"]

[project.scripts]
computer-use-linux = "computer_use_linux_adapters.cli.computer_use_linux_cli:main"
computer-use-linux-agent = "computer_use_linux_adapters.cli.agent_loop:main"
computer-use-linux-http = "computer_use_linux_adapters.http.server:main"
computer-use-linux-mcp = "computer_use_linux_adapters.mcp.server:main"

[tool.setuptools]
package-dir = { "computer_use_linux" = "core/computer_use_linux", "computer_use_linux_adapters" = "adapters" }
packages = [
    "computer_use_linux", "computer_use_linux.backends", "computer_use_linux.platforms",
    "computer_use_linux_adapters", "computer_use_linux_adapters.cli", "computer_use_linux_adapters.http",
    "computer_use_linux_adapters.mcp", "computer_use_linux_adapters.skill",
]

[tool.setuptools.package-data]
"computer_use_linux_adapters.skill" = ["*.md"]
